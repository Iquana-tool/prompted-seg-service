[project]
name = "iquana-prompted-seg"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.2",
    "fastapi[standard]>=0.116.2",
    "iquana-service-core",
    "iquana-toolbox",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "torch",
    "torchvision",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
iquana-service-core = { git = "https://github.com/Iquana-tool/iquana-service-core.git" }
# For local dev before that repo is pushed, swap the line above for a path source:
# iquana-service-core = { path = "../iquana-service-core" }
iquana-toolbox = { git = "https://github.com/Iquana-tool/iquana-toolbox.git" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

